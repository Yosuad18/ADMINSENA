<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" role="img" aria-label="Ilustración geométrica del programa Contabilidad y Finanzas">
  <!-- Programa: CF — columnas de balance y moneda -->
  <rect width="800" height="560" fill="#FBF6E8"/>
  <!-- Eje base -->
  <line x1="140" y1="450" x2="660" y2="450" stroke="#00324D" stroke-width="10" stroke-linecap="round"/>
  <!-- Columnas ascendentes -->
  <g>
    <rect x="190" y="330" width="76" height="120" rx="8" fill="#B58A00" opacity="0.45"/>
    <rect x="300" y="270" width="76" height="180" rx="8" fill="#B58A00" opacity="0.7"/>
    <rect x="410" y="210" width="76" height="240" rx="8" fill="#B58A00"/>
    <rect x="520" y="150" width="76" height="300" rx="8" fill="#39A900"/>
  </g>
  <!-- Flecha de crecimiento -->
  <polyline points="205,300 330,235 445,175 560,105"
            fill="none" stroke="#00324D" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M560 78 L592 96 L568 122 Z" fill="#00324D"/>
  <!-- Moneda -->
  <circle cx="170" cy="150" r="52" fill="#FFFFFF" stroke="#B58A00" stroke-width="12"/>
  <text x="170" y="168" text-anchor="middle" font-family="Arial, sans-serif" font-size="48" font-weight="bold" fill="#B58A00">$</text>
</svg>
