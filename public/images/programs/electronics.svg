<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" role="img" aria-label="Ilustración geométrica del programa Mantenimiento Electrónico Industrial">
  <!-- Programa: MEI — chip con pistas de circuito -->
  <rect width="800" height="560" fill="#EAF2F8"/>
  <!-- Pistas de circuito -->
  <g stroke="#1769AA" stroke-width="8" fill="none" stroke-linecap="round">
    <path d="M400 200 V120 H250"/>
    <path d="M400 360 V440 H550"/>
    <path d="M240 280 H140 V380"/>
    <path d="M560 280 H660 V180"/>
  </g>
  <g fill="#1769AA">
    <circle cx="250" cy="120" r="12"/>
    <circle cx="550" cy="440" r="12"/>
    <circle cx="140" cy="380" r="12"/>
    <circle cx="660" cy="180" r="12"/>
  </g>
  <!-- Cuerpo del chip -->
  <rect x="300" y="200" width="200" height="160" rx="14" fill="#00324D"/>
  <rect x="330" y="230" width="140" height="100" rx="8" fill="#1769AA"/>
  <!-- Pines -->
  <g stroke="#00324D" stroke-width="14" stroke-linecap="round">
    <line x1="340" y1="200" x2="340" y2="168"/>
    <line x1="400" y1="200" x2="400" y2="168"/>
    <line x1="460" y1="200" x2="460" y2="168"/>
    <line x1="340" y1="360" x2="340" y2="392"/>
    <line x1="400" y1="360" x2="400" y2="392"/>
    <line x1="460" y1="360" x2="460" y2="392"/>
  </g>
  <!-- Núcleo activo -->
  <rect x="386" y="266" width="28" height="28" rx="6" fill="#39A900"/>
</svg>
