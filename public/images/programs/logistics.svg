<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" role="img" aria-label="Ilustración geométrica del programa Gestión Logística">
  <!-- Programa: GL — ruta de flujo con cajas -->
  <rect width="800" height="560" fill="#FDF1EB"/>
  <!-- Ruta punteada -->
  <path d="M130 420 C260 420 260 280 400 280 C540 280 540 140 670 140"
        fill="none" stroke="#E75A1C" stroke-width="10" stroke-dasharray="2 34" stroke-linecap="round"/>
  <!-- Origen -->
  <circle cx="130" cy="420" r="26" fill="#FFFFFF" stroke="#E75A1C" stroke-width="10"/>
  <!-- Destino -->
  <path d="M670 108 L712 140 L670 172 L628 140 Z" fill="#E75A1C"/>
  <!-- Cajas apiladas -->
  <g>
    <rect x="330" y="300" width="90" height="90" rx="8" fill="#E75A1C"/>
    <rect x="330" y="338" width="90" height="14" fill="#FFFFFF" opacity="0.75"/>
    <rect x="440" y="330" width="70" height="70" rx="8" fill="#B54313"/>
    <line x1="475" y1="330" x2="475" y2="400" stroke="#FFFFFF" stroke-width="8" opacity="0.75"/>
  </g>
  <!-- Indicador de peso/carga -->
  <rect x="150" y="150" width="120" height="60" rx="30" fill="#00324D"/>
  <circle cx="210" cy="180" r="16" fill="#39A900"/>
</svg>
