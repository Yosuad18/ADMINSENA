  <rect x="350" y="270" width="100" height="84" rx="10" fill="#FFFFFF"/>
  <path d="M368 270 v-30 a32 32 0 0 1 64 0 v30" fill="none" stroke="#FFFFFF" stroke-width="18"/>
  <circle cx="400" cy="304" r="13" fill="#00324D"/>
  <rect x="394" y="310" width="12" height="26" rx="6" fill="#00324D"/>
  <!-- Pulsos de monitoreo -->
  <polyline points="120,300 170,300 190,250 215,350 235,300 290,300"
            fill="none" stroke="#39A900" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <polyline points="510,300 565,300 585,250 610,350 630,300 685,300"
            fill="none" stroke="#39A900" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
