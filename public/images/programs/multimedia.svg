<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" role="img" aria-label="Ilustración geométrica del programa Diseño e Integración de Multimedia">
  <!-- Programa: DIM — capas de medios y botón de reproducción -->
  <rect width="800" height="560" fill="#F5EFFB"/>
  <!-- Capas desplazadas (video, imagen, audio) -->
  <rect x="220" y="150" width="360" height="240" rx="16" fill="#7A2FBF" opacity="0.25"/>
  <rect x="190" y="190" width="360" height="240" rx="16" fill="#7A2FBF" opacity="0.5"/>
  <rect x="160" y="230" width="360" height="240" rx="16" fill="#7A2FBF"/>
  <!-- Botón de reproducción -->
  <path d="M305 290 L430 350 L305 410 Z" fill="#FFFFFF"/>
  <!-- Onda de audio -->
  <g stroke="#41BC03" stroke-width="10" stroke-linecap="round">
    <line x1="580" y1="310" x2="580" y2="390"/>
    <line x1="615" y1="290" x2="615" y2="410"/>
    <line x1="650" y1="320" x2="650" y2="380"/>
    <line x1="685" y1="270" x2="685" y2="430"/>
  </g>
  <!-- Fotogramas -->
  <g fill="none" stroke="#00324D" stroke-width="6">
    <rect x="130" y="130" width="46" height="34" rx="6"/>
    <rect x="186" y="130" width="46" height="34" rx="6"/>
  </g>
</svg>
