<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" role="img" aria-label="Ilustración geométrica del programa Gestión de Redes de Datos">
  <!-- Programa: GRD — grafo de nodos conectados -->
  <rect width="800" height="560" fill="#EBF5EE"/>
  <!-- Enlaces -->
  <g stroke="#007832" stroke-width="6" opacity="0.35">
    <line x1="400" y1="280" x2="190" y2="150"/>
    <line x1="400" y1="280" x2="610" y2="150"/>
    <line x1="400" y1="280" x2="170" y2="420"/>
    <line x1="400" y1="280" x2="630" y2="420"/>
    <line x1="190" y1="150" x2="610" y2="150"/>
    <line x1="170" y1="420" x2="630" y2="420"/>
  </g>
  <!-- Nodos satélite -->
  <g>
    <circle cx="190" cy="150" r="34" fill="#FFFFFF" stroke="#007832" stroke-width="8"/>
    <circle cx="610" cy="150" r="34" fill="#FFFFFF" stroke="#007832" stroke-width="8"/>
    <circle cx="170" cy="420" r="34" fill="#FFFFFF" stroke="#007832" stroke-width="8"/>
    <circle cx="630" cy="420" r="34" fill="#FFFFFF" stroke="#007832" stroke-width="8"/>
  </g>
  <!-- Nodo central -->
  <circle cx="400" cy="280" r="72" fill="#007832"/>
  <circle cx="400" cy="280" r="40" fill="#FFFFFF"/>
  <circle cx="400" cy="280" r="14" fill="#00324D"/>
  <!-- Paquetes de datos en tránsito -->
  <rect x="278" y="196" width="20" height="20" rx="4" fill="#00324D" transform="rotate(45 288 206)"/>
  <rect x="508" y="330" width="20" height="20" rx="4" fill="#00324D" transform="rotate(45 518 340)"/>
</svg>
