<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" role="img" aria-label="Ilustración geométrica del programa Análisis y Desarrollo de Software">
  <!-- Programa: ADSO — ventana de terminal con código abstracto -->
  <rect width="800" height="560" fill="#EFF7EA"/>
  <!-- Ventana -->
  <rect x="150" y="110" width="500" height="340" rx="18" fill="#00324D"/>
  <rect x="150" y="110" width="500" height="56" rx="18" fill="#1769AA"/>
  <rect x="150" y="148" width="500" height="18" fill="#1769AA"/>
  <!-- Controles de ventana -->
  <circle cx="186" cy="138" r="10" fill="#39A900"/>
  <circle cx="220" cy="138" r="10" fill="#FFFFFF" opacity="0.6"/>
  <circle cx="254" cy="138" r="10" fill="#FFFFFF" opacity="0.3"/>
  <!-- Líneas de "código" -->
  <g stroke-linecap="round">
    <line x1="200" y1="230" x2="330" y2="230" stroke="#39A900" stroke-width="14"/>
    <line x1="250" y1="280" x2="470" y2="280" stroke="#FFFFFF" stroke-width="14" opacity="0.85"/>
    <line x1="250" y1="330" x2="400" y2="330" stroke="#FFFFFF" stroke-width="14" opacity="0.55"/>
    <line x1="200" y1="380" x2="290" y2="380" stroke="#41BC03" stroke-width="14"/>
    <line x1="430" y1="380" x2="600" y2="380" stroke="#39A900" stroke-width="14"/>
  </g>
  <!-- Cursor parpadeante (estático) -->
  <rect x="320" y="372" width="16" height="16" fill="#FFFFFF"/>
</svg>
